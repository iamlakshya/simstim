# Built-in network presets (spec 7.2).
#
# locked opens only the agent's own Egress hosts from internal/agents.
# balanced opens locked plus the package registries and code hosts below.
# open opens every public host, never the refused ranges in ranges.toml.
#
# Object stores stay out of balanced: spec 7.2 opens them only when a grant
# names the host.

[[balanced.registries]]
host = "registry.npmjs.org"
ports = [443]
source = "https://docs.npmjs.com/cli/v11/using-npm/registry"

[[balanced.registries]]
host = "registry.yarnpkg.com"
ports = [443]
source = "https://yarnpkg.com/configuration/yarnrc#npmRegistryServer"

[[balanced.registries]]
host = "pypi.org"
ports = [443]
source = "https://docs.pypi.org/api/index-api/"

[[balanced.registries]]
host = "files.pythonhosted.org"
ports = [443]
source = "https://docs.pypi.org/api/index-api/"

[[balanced.registries]]
host = "crates.io"
ports = [443]
source = "https://doc.rust-lang.org/cargo/reference/registries.html"

[[balanced.registries]]
host = "static.crates.io"
ports = [443]
source = "https://doc.rust-lang.org/cargo/reference/registries.html"

[[balanced.registries]]
host = "index.crates.io"
