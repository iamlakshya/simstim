# Service barriers apply for every unknown action and after a host grant.
# Their only exception is a normally matched path and method allowance.

[[barriers]]
hosts = ["discord.com", "discordapp.com"]
path = "/api/webhooks/**"
kind = "grant"
source = "https://securitylabs.datadoghq.com/articles/mut-8964-an-npm-and-pypi-malicious-campaign-targeting-windows-users/"

[[barriers]]
hosts = ["api.telegram.org"]
path = "/bot"
path_prefix = true
kind = "grant"
source = "https://securitylabs.datadoghq.com/articles/mut-8964-an-npm-and-pypi-malicious-campaign-targeting-windows-users/"

[[barriers]]
hosts = ["pastebin.com"]
path = "/**"
except_methods = ["GET", "HEAD"]
kind = "grant"
source = "https://socket.dev/blog/stegabin-26-malicious-npm-packages-use-pastebin-steganography"
