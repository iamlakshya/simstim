name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job asks for what it needs; nothing more by default.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a pull request's run. On main a running run finishes,
  # and the newest push runs next (GitHub drops older runs still waiting).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build the host helpers and the shadow terminal (the client embeds them)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o internal/client/helpers/host-linux-$arch ./cmd/host
          done
          (cd vt && zig build linux)
          for arch in amd64 arm64; do cp vt/zig-out/linux/shadow-vt-$arch internal/client/helpers/vt-linux-$arch; done
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Coverage of internal/ without the launcher (70 % or more)
        run: scripts/cover.sh 70
      - name: Cross-build the client
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null .
          done
      - name: Name check
        run: scripts/check-name.sh
      - name: Private-detail check
        run: scripts/check-private.sh
      - name: Shell script check
        run: scripts/check-scripts.sh
      - name: Public-readiness checker regression tests (offline)
        run: python3 scripts/test-scorecard-check.py
      - name: No Go source file over 500 lines
        run: scripts/check-size.sh
      - name: Generated docs are current
        run: |
          go run ./cmd/docgen
          if [ -n "$(git status --porcelain docs/reference)" ]; then
            git status --short docs/reference
            echo "::error::docs/reference is stale. Run just docs and commit the result."
            exit 1
          fi

  docker-host:
    # `host create docker`, then the end-to-end suite against the container,
    # then `host destroy`: the exec transport, proved live (record 0013).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build the client, with the host helper and the shadow terminal
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o internal/client/helpers/host-linux-amd64 ./cmd/host
          (cd vt && zig build linux)
          cp vt/zig-out/linux/shadow-vt-amd64 internal/client/helpers/vt-linux-amd64
          CGO_ENABLED=0 go build -trimpath -o bin/client .
      - name: Create a host in a container
        run: bin/client host create docker ci
      - name: End-to-end tests against it
        env:
          E2E_HOST: ci
        run: python3 test/e2e/run.py bin/client
      - name: Destroy it
        if: always()
        run: bin/client host destroy ci --yes --force

  docs-impact:
    # A pull request that changes commands, config, keys or agents must change
    # the docs and the CHANGELOG too, unless it is labelled "no docs needed".
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no docs needed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Docs ship with the change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-docs-impact.sh "$BASE" HEAD

  bench:
    # A pull request must not slow the attach pump: its benchmarks run against
    # the base commit's, on the same runner, in turns.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The attach pump is no slower than the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # Shared runners are noisier than a laptop.
          BENCH_MAX: "15"
        run: scripts/bench.sh "$BASE"

  windows:
    # The client also runs on Windows (with Windows OpenSSH); hosts are Linux.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests of the portable packages
        run: go test -count=1 ./internal/client/... ./internal/keys/... ./internal/term/... ./internal/ring/... ./internal/proto/... ./internal/agents/... ./internal/api/...
      - name: Build the client
        run: go build -o client.exe .

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the host helpers (the client embeds them)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o internal/client/helpers/host-linux-$arch ./cmd/host
          done
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Known vulnerabilities in the code we call
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: No dead code, tests included
        run: |
          out=$(GOTOOLCHAIN=auto go run golang.org/x/tools/cmd/deadcode@v0.38.0 -test ./...)
          [ -z "$out" ] || { echo "$out"; echo "::error::Dead code: remove it, or use it."; exit 1; }

  workflows:
    # Lint the workflows themselves: template injection, credentials left in
    # the checkout, unpinned actions and broad permissions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  reproducible:
    # Two builds of every release binary from empty caches must match byte
    # for byte, so anyone can check a release against the source.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - run: scripts/repro.sh

  install:
    # install.sh against a local, signed snapshot release: it must install a
    # good release and refuse changed checksums, signatures or archives.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - run: scripts/test-install.sh

  public-check:
    # Everything that must hold before the repository goes public: no
    # secrets or private details in the tree or the history, REUSE, the docs,
    # the workflows and the Scorecard checks this repository controls.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Scorecard reads the workflow runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
      - run: scripts/setup.sh --only gitleaks,scorecard,node,pnpm,typos,vale,lychee
      - name: Public-readiness checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/public-check.sh

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the whole history with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
