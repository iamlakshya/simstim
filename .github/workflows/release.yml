name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  microvm-conformance:
    # This release builds/publishes both native guest images below. Require
    # actual conformance from this exact source before either publication.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the completed conformance run's source and workflow
        env:
          GH_TOKEN: ${{ github.token }}
          CONFORMANCE_RUN: ${{ vars.MICROVM_CONFORMANCE_RUN }}
        run: |
          case "$CONFORMANCE_RUN" in ''|*[!0-9]*) echo 'A completed actual conformance run is required before publishing the microvm wall.' >&2; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONFORMANCE_RUN" > "$RUNNER_TEMP/conformance-run.json"
          revision=$(git rev-parse HEAD)
          python3 - "$RUNNER_TEMP/conformance-run.json" "$revision" <<'PY'
          import json,sys
          run=json.load(open(sys.argv[1]))
          if run.get('head_sha')!=sys.argv[2] or run.get('status')!='completed' or run.get('conclusion')!='success' or run.get('event')!='workflow_dispatch' or run.get('path','').split('@')[0]!='.github/workflows/microvm-conformance.yml':
              raise SystemExit('The actual complete microvm conformance workflow for this exact source is missing; publication is blocked.')
          PY
          gh run download "$CONFORMANCE_RUN" --repo "$GITHUB_REPOSITORY" --pattern "microvm-*-$revision" --dir "$RUNNER_TEMP/conformance"
      - name: Recompute native assurance and conservative latency from original artifacts
        env:
          ISSUES: ${{ vars.MICROVM_CONFORMANCE_ISSUES }}
        run: |
          revision=$(git rev-parse HEAD)
          module=$(sed -n 's/^module //p' go.mod)
          for arch in amd64 arm64; do
            python3 scripts/check-conformance-go.py "$RUNNER_TEMP/conformance/microvm-native-$arch-$revision/native-go.jsonl" \
              --package "$module/internal/diag" --package "$module/internal/host" --package "$module/internal/supervisor" \
              --package "$module/internal/jail" --package "$module/internal/wall/process" \
              --package "$module/internal/wall/microvm" --package "$module/internal/guest"
          done
          if [ -n "$ISSUES" ]; then printf '%s\n' "$ISSUES" > "$RUNNER_TEMP/conformance-issues.json"; else printf '{}\n' > "$RUNNER_TEMP/conformance-issues.json"; fi
          python3 scripts/check-microvm-conformance.py --revision "$revision" --issues "$RUNNER_TEMP/conformance-issues.json" \
            "$RUNNER_TEMP/conformance/microvm-bare-metal-amd64-$revision/report.json" \
            "$RUNNER_TEMP/conformance/microvm-nested-amd64-$revision/report.json" \
            "$RUNNER_TEMP/conformance/microvm-bare-metal-arm64-$revision/report.json" \
            "$RUNNER_TEMP/conformance/microvm-nested-arm64-$revision/report.json"

  default-image:
    needs: microvm-conformance
    # Native builders avoid an undeclared QEMU/binfmt host setup.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the image release's signed tag against main before any build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git fetch --quiet --force origin +refs/heads/main:refs/remotes/origin/main ||
            ! git show refs/remotes/origin/main:scripts/verify-tag.sh >"$RUNNER_TEMP/verify-tag.sh"; then
            echo "release: cannot read the main branch's signed-tag gate."
            echo "Try: use the normal public-repository release workflow."
            exit 1
          fi
          bash "$RUNNER_TEMP/verify-tag.sh" "$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Prepare the locked minimal root and actual OCI/verity artifacts
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: guest/base-image/build.sh "$IMAGE_ARCH"
      - name: Publish exact OCI bytes and verify anonymous digest access
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: guest/base-image/publish.sh "$IMAGE_ARCH" "$RELEASE_TAG"
      - name: Preserve the actual per-architecture artifact permissions
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: tar -C build/default-image -czf "$RUNNER_TEMP/default-image-$IMAGE_ARCH.tar.gz" "$IMAGE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: default-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/default-image-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1
  gvisor-runtime:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main's signed-tag gate before preparing upstream tools
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git fetch --quiet --force origin +refs/heads/main:refs/remotes/origin/main ||
            ! git show refs/remotes/origin/main:scripts/verify-tag.sh >"$RUNNER_TEMP/verify-tag.sh"; then
            echo 'release: cannot read the main signed-tag gate.' >&2
            echo 'Try: use the normal signed release workflow.' >&2
            exit 1
          fi
          bash "$RUNNER_TEMP/verify-tag.sh" "$TAG"
      - name: Prepare checksum-bound upstream Bazel and SDK inputs
        # This never changes PATH, project Go, GOTOOLCHAIN or the module.
        run: |
          python3 scripts/prepare-gvisor-build.py \
            --output "$RUNNER_TEMP/gvisor-tools" \
            --cache "$RUNNER_TEMP/gvisor-input-downloads" --env-file "$GITHUB_ENV"
      - name: Prepare the exact public upstream checkout and native closure
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          export HOME="$RUNNER_TEMP/gvisor-home" USERPROFILE="$RUNNER_TEMP/gvisor-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/gvisor-xdg/config" XDG_CACHE_HOME="$RUNNER_TEMP/gvisor-xdg/cache"
          export XDG_DATA_HOME="$RUNNER_TEMP/gvisor-xdg/data" XDG_STATE_HOME="$RUNNER_TEMP/gvisor-xdg/state"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gvisor-xdg/run" XDG_CONFIG_DIRS="$RUNNER_TEMP/gvisor-xdg/config-dirs"
          export XDG_DATA_DIRS="$RUNNER_TEMP/gvisor-xdg/data-dirs"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR" "$XDG_CONFIG_DIRS" "$XDG_DATA_DIRS"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          source_root="$RUNNER_TEMP/gvisor-source"
          git -c core.hooksPath=/dev/null init "$source_root"
          git -C "$source_root" -c core.hooksPath=/dev/null remote add origin https://github.com/google/gvisor.git
          git -C "$source_root" -c core.hooksPath=/dev/null fetch --depth=1 origin 7a675ac66a1e2357abdaa6cccedabcd3cce9aa5c
          git -C "$source_root" -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          python3 scripts/build-gvisor-runtime.py "$source_root" "build/gvisor/$BUILD_ARCH"
          tar -C build/gvisor -czf "$RUNNER_TEMP/gvisor-$BUILD_ARCH.tar.gz" "$BUILD_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvisor-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/gvisor-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [default-image, gvisor-runtime, microvm-conformance]
    runs-on: ubuntu-latest
    # The release secrets live in this environment, not in the repository,
    # so a workflow from before the signed-tag gate cannot read them
    # (decision 0041, docs/contributing/releasing.md).
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # keyless signing with cosign, and attestations
      attestations: write
      pages: read # the docs site's address, for this version's docs
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      # Pinned at v6.0.2 or later, as spec 20.7 asks. The gate fetches the
      # tag again, so it does not rely on the checkout's copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The signed-tag gate, before any build step (decision 0041)
        # main's copy of the gate, never the tagged commit's, so a tag cannot
        # bring its own gate. Both fetches use no token on purpose: the
        # repository is public, and a token here would be one more secret
        # that a tag's run can reach. It wants a signed annotated tag, by a key in
        # .github/tag-signers as main has it, on a commit on main that this
        # job checked out. Any failure stops the job here.
        # scripts/test-verify-tag.sh runs this block as it stands.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git fetch --quiet --force origin +refs/heads/main:refs/remotes/origin/main ||
            ! git show refs/remotes/origin/main:scripts/verify-tag.sh >"$RUNNER_TEMP/verify-tag.sh"; then
            echo "release: cannot read scripts/verify-tag.sh from main. The gate fetches with no token, so it needs a public repository." >&2
            echo "Try: run the release job again. If it fails again, check that main has the script. A private fork must give the gate's fetch a read-only token, and remove it before the build." >&2
            exit 1
          fi
          bash "$RUNNER_TEMP/verify-tag.sh" "$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false # a release builds from nothing
      - name: Prepare the genuine package-malware feed before helper and client builds
        # The explicit producer checks all four bounded OSV archive inputs and
        # retains their SHA-256 provenance. Missing data must fail the release.
        run: go run -tags="$(sh scripts/go-build-tags.sh)" ./cmd/feedgen --output internal/egress/rules/feed/snapshot.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: default-image-amd64
          path: build/default-image-transport/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: default-image-arm64
          path: build/default-image-transport/arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gvisor-runtime-amd64
          path: build/gvisor-transport/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gvisor-runtime-arm64
          path: build/gvisor-transport/arm64
      - name: Retain both actual native gVisor artifact sets
        run: |
          mkdir -p build/gvisor
          for arch in amd64 arm64; do
            tar -xzf "build/gvisor-transport/$arch/gvisor-$arch.tar.gz" --no-same-owner -C build/gvisor
          done
      - name: Recheck both actual default image artifacts before embedding
        run: |
          mkdir -p build/default-image
          for arch in amd64 arm64; do
            tar -xzf "build/default-image-transport/$arch/default-image-$arch.tar.gz" --no-same-owner -C build/default-image
            go run -tags="$(sh scripts/go-build-tags.sh)" ./cmd/supply default-image check --dir "build/default-image/$arch"
            go run -tags="$(sh scripts/go-build-tags.sh)" ./cmd/supply default-image published --dir "build/default-image/$arch"
          done
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false # a release builds from nothing
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Read the product name, the module path and the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "APP_NAME=$(sed -n 's/^const Name = "\(.*\)"/\1/p' internal/brand/brand.go)" >> "$GITHUB_ENV"
          echo "MODULE=$(sed -n 's/^module //p' go.mod)" >> "$GITHUB_ENV"
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Build both guest kernels with the pinned builder
        # The build script verifies the signed Debian snapshot metadata and
        # every source input against guest/supply.lock. It starts no guest.
        run: guest/build.sh --only-kernels all
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the tag that the gate checked. Without it, GoReleaser picks
          # the highest version among the tags on this commit, which may be
          # another, unsigned tag.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Set this secret, in the release environment, once the tap
          # repository exists; until then the cask is built into dist/ and
          # not pushed.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Boot-test the native guest when this runner has KVM access
        # An absent device leaves the hardware check for an authorised test
        # host. Do not change the runner's device permissions.
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            guest/boot-test.sh
          else
            echo "No KVM access; guest boot checks remain for an authorised test host."
          fi
      - name: Check the uploaded runtime files before uploading the release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          manifest=internal/client/helpers/release-manifest.json
          dir=$(mktemp -d)
          assets=$(go run -tags="$(sh scripts/go-build-tags.sh)" ./cmd/supply assets "$manifest")
          for asset in $assets; do
            gh release download "$TAG" --pattern "$asset" --dir "$dir"
          done
          go run -tags="$(sh scripts/go-build-tags.sh)" ./cmd/supply check -require-guest -require-kernel-efi -require-vmm -vmm build/vmm -gvisor build/gvisor -require-gvisor -images build/default-image -require-images -require-launch -require-image-verifier -require-mac-runtime -url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" -dir "$dir" "$manifest"
          gh release upload "$TAG" "$manifest"
      - name: Sign the checksums with the release SSH key
        # install.sh checks this signature with ssh-keygen, which every host
        # with OpenSSH has; the public key is .github/release-signers.
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SSH_KEY" > "$key"
          ssh-keygen -q -Y sign -n file -f "$key" dist/checksums.txt
          ssh-keygen -Y verify -f .github/release-signers -I release -n file -s dist/checksums.txt.sig < dist/checksums.txt
          gh release upload "$TAG" dist/checksums.txt.sig
          for arch in amd64 arm64; do
            envelope="$RUNNER_TEMP/launch-$arch.json"
            go run -tags="$(sh scripts/go-build-tags.sh)" ./cmd/launchmeta -binary "internal/client/helpers/launch-$arch" -arch "$arch" -version "${TAG#v}" -output "$envelope"
            ssh-keygen -q -Y sign -n "$APP_NAME-launch" -f "$key" "$envelope"
            go run -tags="$(sh scripts/go-build-tags.sh)" ./cmd/launchmeta -binary "internal/client/helpers/launch-$arch" -arch "$arch" -version "${TAG#v}" -output "$envelope" -verify-signature "$envelope.sig"
            gh release upload "$TAG" "$envelope" "$envelope.sig"
          done
      - name: Docs tools (pinned in scripts/tools.lock)
        # A step of its own: setup.sh adds .tools/bin to GITHUB_PATH, which
        # only the steps after it see.
        run: scripts/setup.sh --only node,pnpm
      - name: The docs site for this version, attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          minor=$(echo "$TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')
          # The Pages address: the custom domain when there is one.
          site=$(gh api "repos/$OWNER/$REPO/pages" --jq .html_url 2>/dev/null || echo "https://$OWNER.github.io/$REPO/")
          site="https://${site#*://}"
          scripts/docs-site.sh "$TAG" "${site%/}/$minor/"
          tar -czf dist/docs-site.tar.gz -C build/site/public .
          gh release upload "$TAG" dist/docs-site.tar.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Hashes for the SLSA provenance
        id: hashes
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    # A signed SLSA level 3 provenance file (*.intoto.jsonl) for every
    # archive, attached to the release.
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Reusable workflows from this project must be referenced by tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      draft-release: true

  notes:
    # The release's notes, from the CHANGELOG, written last: the provenance
    # job's upload replaces the body of the draft it adds its file to.
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          LINK_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
