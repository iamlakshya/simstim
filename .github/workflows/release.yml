name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # keyless signing with cosign, and attestations
      attestations: write
      pages: read # the docs site's address, for this version's docs
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false # a release builds from nothing
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Read the product name, the module path and the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "APP_NAME=$(sed -n 's/^const Name = "\(.*\)"/\1/p' internal/brand/brand.go)" >> "$GITHUB_ENV"
          echo "MODULE=$(sed -n 's/^module //p' go.mod)" >> "$GITHUB_ENV"
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set this secret once the tap repository exists; until then the
          # cask is built into dist/ and not pushed.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Sign the checksums with the release SSH key
        # install.sh checks this signature with ssh-keygen, which every host
        # with OpenSSH has; the public key is .github/release-signers.
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SSH_KEY" > "$key"
          ssh-keygen -q -Y sign -n file -f "$key" dist/checksums.txt
          ssh-keygen -Y verify -f .github/release-signers -I release -n file -s dist/checksums.txt.sig < dist/checksums.txt
          gh release upload "$TAG" dist/checksums.txt.sig
      - name: Docs tools (pinned in scripts/tools.lock)
        # A step of its own: setup.sh adds .tools/bin to GITHUB_PATH, which
        # only the steps after it see.
        run: scripts/setup.sh --only node,pnpm
      - name: The docs site for this version, attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          minor=$(echo "$TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')
          # The Pages address: the custom domain when there is one.
          site=$(gh api "repos/$OWNER/$REPO/pages" --jq .html_url 2>/dev/null || echo "https://$OWNER.github.io/$REPO/")
          site="https://${site#*://}"
          scripts/docs-site.sh "$TAG" "${site%/}/$minor/"
          tar -czf dist/docs-site.tar.gz -C build/site/public .
          gh release upload "$TAG" dist/docs-site.tar.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Hashes for the SLSA provenance
        id: hashes
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    # A signed SLSA level 3 provenance file (*.intoto.jsonl) for every
    # archive, attached to the release.
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Reusable workflows from this project must be referenced by tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      draft-release: true
