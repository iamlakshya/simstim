# Release configuration. Binary names come from APP_NAME, which the justfile and the
# release workflow read from internal/brand, so a rename needs no change here.
version: 2

before:
  hooks:
    - go mod tidy -diff
    # The client embeds the host helpers, so build them first.
    - sh -c 'for arch in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X {{ .Env.MODULE }}/internal/version.Version={{ .Version }}" -o internal/client/helpers/host-linux-$arch ./cmd/host; done'
    # The shadow terminal (Zig 0.17), embedded next to the host helpers.
    - sh -c 'cd vt && zig build linux && cd .. && for arch in amd64 arm64; do cp vt/zig-out/linux/shadow-vt-$arch internal/client/helpers/vt-linux-$arch; done'
    # Man pages and shell completions, from the command tree.
    - go run ./cmd/docgen -out build/reference -man build/man -completions build/completions

builds:
  - id: host
    main: ./cmd/host
    binary: "{{ .Env.APP_NAME }}-host"
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X {{ .Env.MODULE }}/internal/version.Version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: cli
    main: .
    binary: "{{ .Env.APP_NAME }}"
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X {{ .Env.MODULE }}/internal/version.Version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cli
    ids: [cli]
    formats: [tar.gz]
    name_template: "{{ .Env.APP_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE, README.md, build/man/*, build/completions/*]
  # The host helpers and shadow terminals the client embeds, for a client
  # built with go install, which fetches this bundle (internal/client/helpers).
  - id: helpers
    meta: true
    formats: [tar.gz]
    name_template: "helpers_{{ .Version }}"
    files:
      - src: internal/client/helpers/host-linux-*
        strip_parent: true
      - src: internal/client/helpers/vt-linux-*
        strip_parent: true
  - id: host
    ids: [host]
    formats: [tar.gz]
    name_template: "{{ .Env.APP_NAME }}-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# The notes come from CHANGELOG.md (scripts/release-notes.sh, passed with
# --release-notes), not from commit messages.
changelog:
  disable: true

# Keyless signature of the checksums: anyone can check every archive with
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]
    output: true

release:
  draft: true
  prerelease: auto

# The Homebrew cask is always built into dist/. It is pushed to the tap only
# when the HOMEBREW_TAP_TOKEN secret is set (docs: going public).
homebrew_casks:
  - name: "{{ .Env.APP_NAME }}"
    ids: [cli]
    repository:
      owner: iamlakshya
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: "https://github.com/iamlakshya/{{ .Env.APP_NAME }}"
    description: Run any coding agent in sessions on any host you own
    license: Apache-2.0
    hooks:
      post:
        # The binaries are not notarised yet, so clear the quarantine flag.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/{{ .Env.APP_NAME }}"]
          end

