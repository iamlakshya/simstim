# Release configuration. Binary names come from APP_NAME, which the justfile and the
# release workflow read from internal/brand, so a rename needs no change here.
version: 2

# Checked against the shared source contract before any build hook.
env:
  - GO_BUILD_TAGS=userns_cohort_v3,http2legacy
  - 'GOTOOLCHAIN={{ if eq (index .Env "GOTOOLCHAIN") "local" }}local{{ else }}go1.27.4{{ end }}'

before:
  hooks:
    - sh scripts/go-build-tags.sh check {{ .Env.GO_BUILD_TAGS }}
    - sh scripts/go-build-tags.sh toolchain
    - go mod tidy -diff
    # Static process launcher and its canonical compiled syscall policy.
    - cmd/userns/build.sh
    - scripts/build-image-verifier.sh {{ .Version }}
    # The client embeds the host helpers, so build them first.
    - sh -c 'for arch in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags={{ .Env.GO_BUILD_TAGS }} -trimpath -ldflags "-s -w -X {{ .Env.MODULE }}/internal/version.Version={{ .Version }}" -o internal/client/helpers/host-linux-$arch ./cmd/host; done'
    - sh -c 'for arch in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags={{ .Env.GO_BUILD_TAGS }} -trimpath -ldflags "-s -w -X {{ .Env.MODULE }}/internal/version.Version={{ .Version }}" -o internal/client/helpers/launch-$arch ./cmd/launch; done'
    # The shadow terminal (Zig 0.17), embedded next to the host helpers.
    - sh -c 'cd vt && zig build linux && cd .. && for arch in amd64 arm64; do cp vt/zig-out/linux/shadow-vt-$arch internal/client/helpers/vt-linux-$arch; done'
    # Pack this release's helpers into the prepared tools image and verity tree.
    - guest/build.sh --only-tools all
    # Mirror the pinned VMMs and their source, then embed their actual raw
    # file digests with the helpers. The release job checks the uploaded files.
    - scripts/mirror-vmm.sh {{ .Version }}
    - scripts/mirror-mac-runtime.sh {{ .Version }}
    - scripts/write-release-manifest.sh {{ .Version }}
    # Man pages and shell completions, from the command tree.
    - go run -tags={{ .Env.GO_BUILD_TAGS }} ./cmd/docgen -out build/reference -man build/man -completions build/completions

builds:
  - id: host
    main: ./cmd/host
    binary: "{{ .Env.APP_NAME }}-host"
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, "-tags={{ .Env.GO_BUILD_TAGS }}"]
    ldflags: ["-s -w -X {{ .Env.MODULE }}/internal/version.Version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: cli
    main: .
    binary: "{{ .Env.APP_NAME }}"
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, "-tags={{ .Env.GO_BUILD_TAGS }}"]
    ldflags: ["-s -w -X {{ .Env.MODULE }}/internal/version.Version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cli
    ids: [cli]
    formats: [tar.gz]
    name_template: "{{ .Env.APP_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE, third-party-licences/*, README.md, build/man/*, build/completions/*]
  # The host helpers and shadow terminals the client embeds, for a client
  # built with go install, which fetches this bundle (internal/client/helpers).
  - id: helpers
    meta: true
    formats: [tar.gz]
    name_template: "helpers_{{ .Version }}"
    files:
      - LICENSE
      - NOTICE
      - third-party-licences/*
      - src: internal/client/helpers/host-linux-*
        strip_parent: true
      - src: internal/client/helpers/vt-linux-*
        strip_parent: true
      - src: internal/client/helpers/userns-linux-*
        strip_parent: true
      - src: internal/client/helpers/launch-*
        strip_parent: true
      - src: internal/client/helpers/image-verifier-*
        strip_parent: true
      - src: internal/client/helpers/release-manifest.json
        strip_parent: true
  - id: host
    ids: [host]
    formats: [tar.gz]
    name_template: "{{ .Env.APP_NAME }}-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - third-party-licences/*
      - src: internal/client/helpers/userns-linux-{{ .Arch }}
        dst: userns

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: internal/client/helpers/host-linux-amd64
      name_template: "{{ .Env.APP_NAME }}-host-linux-amd64"
    - glob: internal/client/helpers/host-linux-arm64
      name_template: "{{ .Env.APP_NAME }}-host-linux-arm64"
    - glob: internal/client/helpers/vt-linux-amd64
      name_template: "{{ .Env.APP_NAME }}-vt-linux-amd64"
    - glob: internal/client/helpers/vt-linux-arm64
      name_template: "{{ .Env.APP_NAME }}-vt-linux-arm64"
    - glob: internal/client/helpers/userns-linux-amd64
      name_template: "{{ .Env.APP_NAME }}-userns-linux-amd64"
    - glob: internal/client/helpers/userns-linux-arm64
      name_template: "{{ .Env.APP_NAME }}-userns-linux-arm64"
    - glob: build/guest/assets/*
    - glob: build/vmm/assets/*
    - glob: build/gvisor/assets/*
    - glob: build/mac-runtime/assets/*
    - glob: internal/client/helpers/release-manifest.json
    - glob: internal/client/helpers/launch-amd64
      name_template: "launch-amd64"
    - glob: internal/client/helpers/launch-arm64
      name_template: "launch-arm64"
    - glob: internal/client/helpers/image-verifier-*

sboms:
  - artifacts: archive

# The notes come from CHANGELOG.md (scripts/release-notes.sh, passed with
# --release-notes), not from commit messages.
changelog:
  disable: true

# Keyless signature of the checksums: anyone can check every archive with
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]
    output: true

release:
  draft: true
  prerelease: auto
  # Upload the manifest only after the workflow checks these raw files.
  extra_files:
    - glob: internal/client/helpers/host-linux-amd64
      name_template: "{{ .Env.APP_NAME }}-host-linux-amd64"
    - glob: internal/client/helpers/host-linux-arm64
      name_template: "{{ .Env.APP_NAME }}-host-linux-arm64"
    - glob: internal/client/helpers/vt-linux-amd64
      name_template: "{{ .Env.APP_NAME }}-vt-linux-amd64"
    - glob: internal/client/helpers/vt-linux-arm64
      name_template: "{{ .Env.APP_NAME }}-vt-linux-arm64"
    - glob: internal/client/helpers/userns-linux-amd64
      name_template: "{{ .Env.APP_NAME }}-userns-linux-amd64"
    - glob: internal/client/helpers/userns-linux-arm64
      name_template: "{{ .Env.APP_NAME }}-userns-linux-arm64"
    - glob: build/guest/assets/*
    - glob: build/vmm/assets/*
    - glob: build/gvisor/assets/*
    - glob: build/mac-runtime/assets/*
    - glob: internal/client/helpers/launch-amd64
      name_template: "launch-amd64"
    - glob: internal/client/helpers/launch-arm64
      name_template: "launch-arm64"
    - glob: internal/client/helpers/image-verifier-*

# The Homebrew cask is always built into dist/. It is pushed to the tap only
# when the HOMEBREW_TAP_TOKEN secret is set (docs: going public).
homebrew_casks:
  - name: "{{ .Env.APP_NAME }}"
    ids: [cli]
    repository:
      owner: iamlakshya
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: "https://github.com/iamlakshya/{{ .Env.APP_NAME }}"
    description: Run any coding agent in sessions on any host you own
    license: Apache-2.0
    hooks:
      post:
        # The binaries are not notarised yet, so clear the quarantine flag.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/{{ .Env.APP_NAME }}"]
          end

